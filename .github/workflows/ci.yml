name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  validation:
    name: Tests and validation
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NXF_VER: '26.10.5'
      NXF_ANSI_LOG: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check changed files for whitespace errors
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
        run: git diff --check "$BASE_SHA" "$HEAD_SHA"
      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21.0.13+9'
      - name: Install pinned Nextflow distribution
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/bin"
          if ! curl --fail --location --retry 3 \
            https://github.com/nextflow-io/nextflow/releases/download/v26.10.5/nextflow-26.10.5-dist \
            --output "$RUNNER_TEMP/bin/nextflow"; then
            # The official asset API avoids failures on the release-page download route.
            curl --fail --location --retry 3 --header 'Accept: application/octet-stream' \
              https://api.github.com/repos/nextflow-io/nextflow/releases/assets/702621068 \
              --output "$RUNNER_TEMP/bin/nextflow"
          fi
          # SHA256 published in the official GitHub release asset metadata.
          echo "b030030c06040bf5f13ac423c318d146c95e8d1d82f5022799dcb24738bccf3e  $RUNNER_TEMP/bin/nextflow" | sha256sum --check --strict
          chmod +x "$RUNNER_TEMP/bin/nextflow"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Check runtime versions
        run: |
          python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version; print(sys.version)'
          java -version
          nextflow -version
          docker info
      - name: Test public workflows
        run: python3 -m unittest discover -s tests -v
      - name: Verify pristine pinned nf-core modules
        run: python3 scripts/check_modules.py
